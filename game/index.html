<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Solara Bay — an open-world crime story in plain 2D canvas: steal cars, outrun the SBPD at five wanted levels, and work eight story missions for the fixer Vera Solano.">
<meta name="theme-color" content="#10141b">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' fill='%2310141b'/%3E%3Ccircle cx='8' cy='8' r='5' fill='%23f2c230'/%3E%3C/svg%3E">
<title>Solara Bay — An Open-World Crime Story</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #10141b; }
  #game { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
  /* Read aloud, never shown: the status line screen readers announce. */
  #status { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
</style>
</head>
<body>
<canvas id="game" aria-label="Solara Bay: an open-world crime game. Drive, steal cars, lose the cops, and work through Vera Solano's eight missions."></canvas>
<p id="status" role="status" aria-live="polite"></p>
<noscript><p style="color: #f2efe4; font-family: system-ui, sans-serif; padding: 2rem;">Solara Bay is a game drawn entirely on a canvas — it needs JavaScript to run.</p></noscript>
<script type="module" src="./src/main.js"></script>
</body>
</html>
